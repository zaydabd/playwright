name: Explorer (sitemap + HTML capture)

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Max pages to crawl
        default: '80'
      screenshots:
        description: 'Screenshots: none | flows | all'
        default: flows
        type: choice
        options: [none, flows, all]
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'config/**'
      - 'playwright.config.ts'
      - 'package*.json'
      - '.github/workflows/explorer.yml'

concurrency:
  group: explorer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      BASE_URL: https://avepoint-dev.outsystems.app/BCMS_Web/
      AVE_USERNAME: ${{ secrets.AVE_USERNAME }}
      AVE_PASSWORD: ${{ secrets.AVE_PASSWORD }}
      MAX_PAGES: ${{ inputs.max_pages || '80' }}
      SCREENSHOTS: ${{ inputs.screenshots || 'flows' }}
      MAX_SCREENSHOTS: '30'
      SLOW_SCREEN_MS: '2000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check secrets
        run: |
          if [ -z "$AVE_USERNAME" ] || [ -z "$AVE_PASSWORD" ]; then
            echo "::error::Repository secrets AVE_USERNAME and AVE_PASSWORD must be set."
            exit 1
          fi

      - name: Run explorer
        run: npx playwright test --project=explorer

      - name: Upload sitemap + HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-output
          path: output/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
